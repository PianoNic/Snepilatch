# Release Drafter config for snepilatch
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Without a bumping label the next version is a patch.
version-resolver:
  default: patch

categories:
  # Left out of the changelog entirely.
  - type: 'pre-exclude'
    when:
      labels:
        - 'skip-changelog'
        - 'dependencies'

  # Changelog sections. The bump a label carries lives on its section.
  - title: '🚀 Features'
    semver-increment: 'minor'
    when:
      label: 'feature'
  - title: '✨ Enhancements'
    semver-increment: 'minor'
    when:
      label: 'enhancement'
  - title: '🛠️ Refactors'
    when:
      label: 'refactor'
  - title: '🐛 Bug Fixes'
    semver-increment: 'patch'
    when:
      label: 'bug'

  # Labels that only steer the version and have no section of their own.
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      labels:
        - 'major'
        - 'breaking'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      label: 'minor'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - 'bugfix'
        - 'patch'
        - 'hotfix'
        - 'security'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&`'

no-changes-template: 'No changes in this release.'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\(.+\))?\!?:.+/'
  - label: 'bug'
    title:
      - '/^fix(\(.+\))?\!?:.+/'
  - label: 'breaking'
    title:
      - '/^.+\!:.+/'
  - label: 'documentation'
    title:
      - '/^docs(\(.+\))?\!?:.+/'
    files:
      - '*.md'
      - 'docs/**/*'
  - label: 'test'
    title:
      - '/^test(\(.+\))?\!?:.+/'
    files:
      - 'test/**/*'
      - '**/*_test.dart'
