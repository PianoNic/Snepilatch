name: Cut a Nightly Build

# Runs on every merge to main, plus workflow_dispatch for a manual cut. Tags and publishes a
# prerelease (vX.Y.Z-nightly.N, N scoped to the current base version), then explicitly dispatches
# build-and-release.yml at that tag — a release published via GITHUB_TOKEN does NOT fire the
# release: published event (GitHub's anti-recursion safeguard), unlike a human publishing one
# through the UI, so this can't just rely on that trigger the way a stable release does. See
# CLAUDE.md "Versioning".
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Two merges landing close together must not both read the same "last nightly" tag number —
  # queue them (not cancel-in-progress) so each sees the previous run's tag before computing the next.
  group: nightly-tag
  cancel-in-progress: false

jobs:
  cut-nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine the next nightly tag
        id: tag
        run: |
          set -e
          BASE=$(grep -m1 'versionName = ' src/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          LAST_N=$(git tag -l "v${BASE}-nightly.*" | sed -E "s/.*-nightly\.([0-9]+)\$/\1/" | sort -n | tail -1)
          NEXT_N=$(( ${LAST_N:-0} + 1 ))
          TAG="v${BASE}-nightly.${NEXT_N}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Cutting $TAG (base version $BASE, from build.gradle.kts)"

      - name: Create and push the tag
        run: |
          git config user.email "79938743+PianoNic@users.noreply.github.com"
          git config user.name "PianoNic"
          git tag -a "${{ steps.tag.outputs.tag }}" -m "Nightly build ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Publish as a GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Snepilatch ${{ steps.tag.outputs.tag }} (nightly)" \
            --prerelease \
            --generate-notes \
            --notes "⚠️ **Nightly build** — unreviewed and may be unstable. Only visible to users on the Nightly update channel. Install at your own risk."

      - name: Trigger the release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # workflow_dispatch IS exempt from the GITHUB_TOKEN anti-recursion restriction that
          # blocks the release: published event above, so this is what actually builds the APK.
          gh workflow run build-and-release.yml --repo "${{ github.repository }}" --ref "${{ steps.tag.outputs.tag }}"
