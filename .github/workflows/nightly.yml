name: Cut a Nightly Build

# Five checks a day, plus workflow_dispatch for a manual cut. Skips entirely if main hasn't moved
# since the last nightly, so a quiet day still produces nothing and the extra checks cost nothing.
# Checking often is the point: the gap between merging something and having a build to test on a
# phone is the gap this closes.
#
# Tags and publishes a prerelease (vX.Y.Z-nightly.N, where X.Y.Z mirrors release-drafter's draft and
# N is scoped to it), then calls build-apk.yml directly to build and upload the APK. It never
# publishes the draft itself, which stays a deliberate human step. See CLAUDE.md "Versioning".
on:
  schedule:
    # UTC, and deliberately inside waking hours: 09:00 to 21:00 Swiss summer time, 08:00 to 20:00
    # in winter. Publishing a release pings the update role in Discord, so a cut at 02:00 wakes
    # people up. Every three hours across the day is close enough to "as soon as it merged".
    - cron: "0 7,10,13,16,19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Cut one even if main has not moved since the last nightly"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # A manual dispatch landing close to a scheduled run must not race it computing the same
  # "last nightly" tag number — queue them (not cancel-in-progress) so each sees the other's tag.
  group: nightly-tag
  cancel-in-progress: false

jobs:
  cut-nightly:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine the next nightly tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          LAST_TAG=$(git tag -l 'v*-nightly.*' --sort=-creatordate | head -1)
          UNCHANGED=false
          if [ -n "$LAST_TAG" ] && [ "$(git rev-list -n1 "$LAST_TAG")" = "$(git rev-parse HEAD)" ]; then
            UNCHANGED=true
          fi
          # The skip exists so a quiet day produces nothing on the schedule. A human asking for a
          # build has already decided it is worth one, so force overrides it: the tag number is
          # scoped per base version, not per commit, so re-cutting the same commit is a valid
          # nightly rather than a collision.
          if [ "$UNCHANGED" = "true" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "No commits on main since $LAST_TAG, skipping this cut."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$UNCHANGED" = "true" ]; then
            echo "Forced: cutting a nightly even though main has not moved since $LAST_TAG."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          # Mirror release-drafter's draft rather than inventing a version: it already resolves the
          # next one from the labels on everything merged since the last release, so a nightly is a
          # preview of the release it leads to. build.gradle.kts is only bumped by hand at release
          # time, so reading it cut nightlies for a version that had already shipped. Sorted rather
          # than first — the drafter can leave more than one draft behind.
          BASE=$(gh api "repos/${{ github.repository }}/releases" \
            --jq '[.[] | select(.draft) | .tag_name | ltrimstr("v")]
                  | sort_by(split(".") | map(tonumber? // 0)) | last // empty')
          SOURCE="the release draft"
          if [ -z "$BASE" ]; then
            BASE=$(grep -m1 'versionName = ' src/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            SOURCE="build.gradle.kts (no release draft found)"
          fi
          LAST_N=$(git tag -l "v${BASE}-nightly.*" | sed -E "s/.*-nightly\.([0-9]+)\$/\1/" | sort -n | tail -1)
          NEXT_N=$(( ${LAST_N:-0} + 1 ))
          TAG="v${BASE}-nightly.${NEXT_N}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Cutting $TAG (base version $BASE, from $SOURCE)"

      - name: Create and push the tag
        if: steps.tag.outputs.skip != 'true'
        run: |
          git config user.email "79938743+PianoNic@users.noreply.github.com"
          git config user.name "PianoNic"
          git tag -a "${{ steps.tag.outputs.tag }}" -m "Nightly build ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Publish as a GitHub prerelease
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --prerelease \
            --generate-notes \
            --notes "⚠️ Nightly build. Unreviewed, probably buggy. Install at your own risk."

  build:
    needs: cut-nightly
    if: needs.cut-nightly.outputs.skip != 'true'
    uses: ./.github/workflows/build-apk.yml
    with:
      tag: ${{ needs.cut-nightly.outputs.tag }}
    secrets: inherit
