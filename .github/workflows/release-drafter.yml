name: Release Drafter

# Push only. A squash merge is a push to main, so a pull_request run on top of it only produced a
# second identical draft, and for a PR from a fork that run has a read-only token and fails.
on:
  push:
    branches:
      - main

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}