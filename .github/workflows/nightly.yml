name: Cut a Nightly Build

# Twice a day (see the cron below — times are UTC; adjust if you want a specific local time), plus
# workflow_dispatch for a manual cut. Skips entirely if main hasn't moved since the last nightly.
# Tags and publishes a prerelease (vX.Y.Z-nightly.N, N scoped to the current base version), then
# calls build-apk.yml directly to build and upload the APK. See CLAUDE.md "Versioning".
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # A manual dispatch landing close to a scheduled run must not race it computing the same
  # "last nightly" tag number — queue them (not cancel-in-progress) so each sees the other's tag.
  group: nightly-tag
  cancel-in-progress: false

jobs:
  cut-nightly:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine the next nightly tag
        id: tag
        run: |
          set -e
          BASE=$(grep -m1 'versionName = ' src/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          LAST_TAG=$(git tag -l 'v*-nightly.*' --sort=-creatordate | head -1)
          if [ -n "$LAST_TAG" ] && [ "$(git rev-list -n1 "$LAST_TAG")" = "$(git rev-parse HEAD)" ]; then
            echo "No commits on main since $LAST_TAG — skipping this cut."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          LAST_N=$(git tag -l "v${BASE}-nightly.*" | sed -E "s/.*-nightly\.([0-9]+)\$/\1/" | sort -n | tail -1)
          NEXT_N=$(( ${LAST_N:-0} + 1 ))
          TAG="v${BASE}-nightly.${NEXT_N}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Cutting $TAG (base version $BASE, from build.gradle.kts)"

      - name: Create and push the tag
        if: steps.tag.outputs.skip != 'true'
        run: |
          git config user.email "79938743+PianoNic@users.noreply.github.com"
          git config user.name "PianoNic"
          git tag -a "${{ steps.tag.outputs.tag }}" -m "Nightly build ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Publish as a GitHub prerelease
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --prerelease \
            --generate-notes \
            --notes "⚠️ **Nightly build** — unreviewed and may be unstable. Only visible to users on the Nightly update channel. Install at your own risk."

  build:
    needs: cut-nightly
    if: needs.cut-nightly.outputs.skip != 'true'
    uses: ./.github/workflows/build-apk.yml
    with:
      tag: ${{ needs.cut-nightly.outputs.tag }}
    secrets: inherit
