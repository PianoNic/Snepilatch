name: Build and Release Snepilatch

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build, e.g. v2.9.80'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      tag: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}
    secrets: inherit
